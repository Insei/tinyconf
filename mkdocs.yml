site_name: tinyconf
site_description: Simple and universal library for parsing configs in Go
site_url: https://insei.github.io/tinyconf/
repo_url: https://github.com/Insei/tinyconf
repo_name: Insei/tinyconf
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Insei/tinyconf
    - icon: simple/go
      link: https://pkg.go.dev/github.com/insei/tinyconf/v2

nav:
  - Get started: index.md
  - Why tinyconf?: why-tinyconf.md
  - Use cases: use-cases.md
  - Upgrading to v2: upgrading.md
  - For AI agents: ai-agents.md
  - Features:
      - features/index.md
      - Manager: features/manager.md
      - Struct tags: features/tags.md
      - Supported types: features/types.md
      - Nested structs and sub configs: features/structs.md
      - Required fields: features/required.md
      - Value sources: features/sources.md
      - Reloading: features/reloading.md
      - Documentation generation: features/gendoc.md
      - Logging: features/logging.md
  - Drivers:
      - drivers/index.md
      - tag: drivers/tag.md
      - yaml: drivers/yaml.md
      - json: drivers/json.md
      - toml: drivers/toml.md
      - ini: drivers/ini.md
      - properties: drivers/properties.md
      - env: drivers/env.md
      - flag: drivers/flag.md
      - consul: drivers/consul.md
      - vault: drivers/vault.md
      - etcd: drivers/etcd.md
      - Custom formats: drivers/format.md
      - Custom drivers: drivers/custom.md

plugins:
  - search
  # llms.txt and llms-full.txt for AI agents: https://llmstxt.org
  - llmstxt:
      full_output: llms-full.txt
      # the links point to the pages of the deployed version, it is set by the docs workflow
      base_url: !ENV [LLMSTXT_BASE_URL, "https://insei.github.io/tinyconf/latest/"]
      markdown_description: >-
        tinyconf fills Go config structs from a chain of drivers by struct tags: defaults, YAML, JSON, TOML, INI,
        properties, environment variables, flags, Consul, Vault and etcd. The next driver overrides the previous one.
        Packages parse and subscribe to their own parts of the config, reloads create new versions of the config.
        The module path is github.com/insei/tinyconf/v2.
      sections:
        Start:
          - index.md: installation and the first config
          - why-tinyconf.md: for whom and for what, comparison with viper, koanf, cleanenv
          - use-cases.md: recipes
          - upgrading.md: upgrading from v1
          - ai-agents.md: the skill for AI agents and llms.txt
        Features:
          - features/*.md
        Drivers:
          - drivers/*.md
